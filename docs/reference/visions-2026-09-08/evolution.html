<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span data-icon="PanelsTopLeft"></span>TaskIndex</div>
    <nav aria-label="Области" class="nav-stack areas" id="area-nav"></nav>
    <div class="section-label">Проекты</div>
    <nav aria-label="Проекты области" class="nav-stack projects" id="project-nav"></nav>
    <div class="sidebar-bottom">
      <div class="archive-note"><span data-icon="Archive"></span>Архив<span class="counter">12</span></div>
      <div class="account"><span class="avatar">Д</span>Дмитрий<span class="lock"><span data-icon="LockKeyhole"></span>Приватно</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="header">
      <div class="heading"><div class="title-wrap"><h1 id="heading">Разработка</h1></div>
        <label class="search-box"><span data-icon="Search"></span><input id="search" type="search" aria-label="Найти задачу во всех областях" placeholder="Найти во всех областях…"><span class="shortcut">⌘ K</span></label>
      </div>
      <div class="toolbar"><div class="tabs" role="tablist" aria-label="Представление задач">
        <button class="tab active" id="board-tab" data-view="board" role="tab" aria-selected="true"><span data-icon="LayoutGrid"></span>Доска</button>
        <button class="tab" id="list-tab" data-view="list" role="tab" aria-selected="false"><span data-icon="List"></span>Список</button>
      </div><div class="toolbar-meta"><span class="task-total" id="total"></span><span class="demo">Демо · 8 сентября</span></div></div>
    </header>
    <div class="workspace">
      <nav class="mobile-project" aria-label="Проекты" id="mobile-project"></nav>
      <section class="resume" id="resume" aria-label="Следующий шаг"></section>
      <div class="board" id="board"></div>
      
    </div>
  </main>
</div>
<dialog class="drawer" id="detail" aria-labelledby="detail-title">
  <div class="drawer-top"><span>Задача</span><button class="close-btn" id="close-detail" aria-label="Закрыть задачу"><span data-icon="X"></span></button></div>
  <div class="drawer-body" id="detail-body"></div>
</dialog>

 const t=tasks.find(t=>t.id===selected);if(!t)return;
 const status=statuses.find(s=>s[0]===t.status);
 document.getElementById('detail-body').innerHTML='<div class="drawer-project">'+dot(t.project)+escape(t.project)+'<span>·</span>'+areaNames[t.area]+'</div><h2 id="detail-title">'+escape(t.title)+'</h2><div class="status-pill"><span class="dot" style="--dot:'+status[2]+'"></span>'+status[1]+(t.focus?' · В фокусе':'')+'</div><section class="detail-section"><div class="detail-label">Следующий шаг'+(t.time?' · '+t.time:'')+'</div><p class="detail-next">'+escape(t.next)+'</p></section>'+(t.person?'<section class="detail-section detail-wait"><span>Жду от</span><strong>'+escape(t.person)+'</strong><span>Вернуться</span><strong>'+escape(t.return)+'</strong></section>':'')+'<section class="detail-section"><div class="detail-label">Где остановились</div><p class="detail-summary">'+escape(t.summary)+'</p></section>'+(t.checks.length?'<section class="detail-section"><div class="detail-label" id="check-progress">Шаги · '+t.checks.filter(c=>c[1]).length+' из '+t.checks.length+'</div><div class="checklist">'+t.checks.map((c,i)=>'<label class="check-row"><input type="checkbox" data-check="'+i+'" '+(c[1]?'checked':'')+'><span>'+escape(c[0])+'</span></label>').join('')+'</div></section>':'')+'<p class="detail-foot">Демо · 8 сентября 2026<br>Изменения чек-листа сохраняются до перезагрузки.</p>';
}
document.addEventListener('click',e=>{
 const task=e.target.closest('[data-task]');if(task){selected=task.dataset.task;lastOpener=task;renderDetail();document.getElementById('detail').showModal();return;}
 const nav=e.target.closest('[data-area]');if(nav){area=nav.dataset.area;project='all';document.getElementById('search').value='';render();return;}
 const p=e.target.closest('[data-project]');if(p){project=p.dataset.project;document.getElementById('search').value='';render();return;}
 const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;render();}
});
document.getElementById('search').addEventListener('input',render);
document.getElementById('detail').addEventListener('change',e=>{if(!e.target.matches('[data-check]'))return;const t=tasks.find(t=>t.id===selected);t.checks[Number(e.target.dataset.check)][1]=e.target.checked;document.getElementById('check-progress').textContent='Шаги · '+t.checks.filter(c=>c[1]).length+' из '+t.checks.length;render();});
document.getElementById('close-detail').addEventListener('click',()=>document.getElementById('detail').close());
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail'){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
document.getElementById('detail').addEventListener('close',()=>{document.querySelector('[data-task="'+selected+'"]')?.focus();selected=null;});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.getElementById('detail').open)document.getElementById('search').focus();}});
render();
</script>
</body>
</html>
