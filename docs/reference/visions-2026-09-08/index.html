<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TaskIndex — четыре представления</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #252932;
        background: #edf0f4;
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #6285ee;
        outline-offset: 3px;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .labbar {
        background: #fff;
        border-bottom: 1px solid #dfe3e9;
        padding: 0 22px;
        min-height: 65px;
        display: flex;
        align-items: center;
        gap: 28px;
        flex-shrink: 0;
      }
      .identity {
        display: flex;
        align-items: baseline;
        gap: 9px;
        white-space: nowrap;
      }
      .identity strong {
        font-size: 16px;
        letter-spacing: -0.5px;
      }
      .identity span {
        font-size: 12px;
        color: #747b88;
      }
      .tabs {
        display: flex;
        gap: 6px;
        align-self: stretch;
        align-items: center;
        flex: 1;
      }
      .tab {
        position: relative;
        border: 0;
        background: none;
        color: #676d79;
        padding: 12px 14px;
        border-radius: 7px;
        font-size: 14px;
        white-space: nowrap;
      }
      .tab em {
        font-style: normal;
        font-size: 11px;
        color: #9298a4;
        margin-right: 7px;
        font-variant-numeric: tabular-nums;
      }
      .tab[aria-selected='true'] {
        background: #edf1fd;
        color: #304fbb;
        font-weight: 600;
      }
      .tab[aria-selected='true'] em {
        color: #6880c7;
      }
      .tab:hover {
        background: #f2f4f8;
      }
      .reference {
        font-size: 13px;
        color: #666f7f;
        text-decoration: none;
        white-space: nowrap;
        border: 1px solid #dce1e9;
        padding: 8px 11px;
        border-radius: 6px;
        background: #fff;
      }
      .context {
        min-height: 45px;
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: space-between;
        padding: 9px 24px;
        background: #fafbfc;
        border-bottom: 1px solid #dde2e9;
        font-size: 13px;
        flex-shrink: 0;
      }
      .idea {
        margin: 0;
        color: #59616f;
      }
      .idea b {
        color: #333d4e;
        font-weight: 500;
      }
      .tools {
        display: flex;
        gap: 12px;
        align-items: center;
        white-space: nowrap;
      }
      .tools button,
      .tools a {
        font-size: 12px;
        color: #666f7e;
        border: 0;
        padding: 0;
        background: transparent;
        text-decoration: none;
      }
      .tools button[aria-pressed='true'] {
        color: #345ed0;
      }
      .tools .separator {
        width: 1px;
        height: 13px;
        background: #d7dce5;
      }
      .canvas {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        padding: 0;
        overflow: hidden;
      }
      .canvas.mobile {
        padding: 16px;
      }
      .canvas iframe {
        border: 0;
        background: #fff;
        width: 100%;
        height: 100%;
        display: block;
      }
      .canvas.mobile iframe {
        width: 390px;
        max-width: 100%;
        box-shadow: 0 4px 26px #16223b18;
        border: 1px solid #d7dce5;
        border-radius: 10px;
      }
      .notes {
        background: #fff;
        border-bottom: 1px solid #dfe3e9;
        padding: 18px 24px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        font-size: 14px;
        line-height: 1.6;
        flex-shrink: 0;
      }
      .notes[hidden] {
        display: none;
      }
      .notes p {
        margin: 0;
      }
      .notes span {
        font-weight: 600;
        display: block;
        margin-bottom: 3px;
      }
      .demo {
        font-size: 12px;
        color: #747c88;
      }
      .baseline {
        width: min(1280px, 95vw);
        border: 1px solid #d8dfe9;
        border-radius: 10px;
        padding: 0;
        max-height: 95vh;
        box-shadow: 0 24px 100px #14203e40;
      }
      .baseline::backdrop {
        background: #12182788;
      }
      .baseline header {
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .baseline h2 {
        font-size: 16px;
        margin: 0;
      }
      .baseline button {
        font-size: 14px;
        border: 0;
        background: #edf0f5;
        padding: 8px 14px;
        border-radius: 5px;
      }
      .baseline img {
        display: block;
        width: 100%;
        height: auto;
      }
      .baseline p {
        padding: 0 20px;
        color: #687486;
        font-size: 13px;
      }
      @media (max-width: 1000px) {
        .labbar {
          gap: 14px;
          padding: 0 12px;
        }
        .identity span {
          display: none;
        }
        .tab {
          padding: 11px 9px;
        }
        .reference {
          font-size: 12px;
        }
        .context {
          padding: 9px 16px;
        }
        .tools .desktop,
        .tools .mobile-button,
        .tools .separator {
          display: none;
        }
      }
      @media (max-width: 680px) {
        .labbar {
          flex-wrap: wrap;
          padding: 10px 12px 0;
          gap: 9px;
          min-height: 90px;
        }
        .identity {
          flex: 1;
        }
        .tabs {
          order: 3;
          width: 100%;
          overflow: auto;
          padding-bottom: 8px;
        }
        .tab {
          flex: 1;
          font-size: 13px;
          padding: 9px 8px;
        }
        .tab em {
          display: none;
        }
        .context {
          align-items: flex-start;
          gap: 9px;
        }
        .idea {
          font-size: 12px;
          line-height: 1.4;
        }
        .tools {
          padding-top: 1px;
        }
        .tools a {
          display: none;
        }
        .notes {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 14px 16px;
          font-size: 13px;
        }
        .canvas.mobile {
          padding: 0;
        }
        .canvas.mobile iframe {
          border: 0;
          border-radius: 0;
        }
        .demo {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="labbar">
      <div class="identity">
        <strong>TaskIndex</strong><span>Лаборатория интерфейса</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Варианты интерфейса">
        <button
          class="tab"
          role="tab"
          data-view="focus"
          id="tab-focus"
          aria-controls="concept"
          aria-selected="true"
        >
          <em>01</em>Фокус
        </button>
        <button
          class="tab"
          role="tab"
          data-view="dispatch"
          id="tab-dispatch"
          aria-controls="concept"
          aria-selected="false"
          tabindex="-1"
        >
          <em>02</em>Диспетчерская
        </button>
        <button
          class="tab"
          role="tab"
          data-view="atlas"
          id="tab-atlas"
          aria-controls="concept"
          aria-selected="false"
          tabindex="-1"
        >
          <em>03</em>Атлас проектов
        </button>
        <button
          class="tab"
          role="tab"
          data-view="evolution"
          id="tab-evolution"
          aria-controls="concept"
          aria-selected="false"
          tabindex="-1"
        >
          <em>04</em>Эволюция
        </button>
      </nav>
      <button class="reference" id="baseline-open">Исходный вид</button>
    </header>
    <section class="context" aria-label="Об этом варианте">
      <p class="idea" id="idea"></p>
      <div class="tools">
        <button class="desktop" id="desktop" aria-pressed="true">
          Десктоп
        </button>
        <button class="mobile-button" id="mobile" aria-pressed="false">
          Телефон
        </button>
        <span class="separator"></span>
        <button id="about" aria-expanded="false" aria-controls="notes">
          Об идее
        </button>
        <a id="direct" href="focus.html" target="_blank" rel="noopener"
          >Открыть отдельно</a
        >
      </div>
    </section>
    <section class="notes" id="notes" hidden>
      <p>
        <span>Как это помогает</span
        ><span id="benefit" style="font-weight: 400"></span>
      </p>
      <p>
        <span>Компромисс</span
        ><span id="tradeoff" style="font-weight: 400"></span
        ><small class="demo"
          >Демонстрационные задачи. Клики меняют только макет; перезагрузка
          сбрасывает изменения.</small
        >
      </p>
    </section>
    <main
      class="canvas"
      id="canvas"
      role="tabpanel"
      aria-labelledby="tab-focus"
    >
      <iframe
        id="concept"
        src="focus.html"
        title="TaskIndex: Фокус"
        sandbox="allow-scripts allow-same-origin"
      ></iframe>
    </main>
    <dialog class="baseline" id="baseline">
      <header>
        <h2>TaskIndex сейчас</h2>
        <button id="baseline-close">Закрыть</button>
      </header>
      <img
        src="current.jpg"
        alt="Исходная главная страница TaskIndex: проекты слева, колонки Очередь, В работе, Жду и Готово"
      />
      <p>
        Снимок текущего локального интерфейса, 8 сентября. Четыре варианта рядом
        — отдельные демонстрации.
      </p>
    </dialog>
    <script>
      const ideas = {
        focus: {
          name: 'Фокус',
          line: 'Одна текущая задача, короткая очередь и контекст для возвращения.',
          benefit:
            'Помогает начать ограниченный шаг и вернуться к нему после переключения. Ожидания остаются рядом, не занимая рабочую очередь.',
          tradeoff:
            'Общий портфель проектов виден хуже. Этот экран рассчитан на выполнение выбранного дела.',
        },
        dispatch: {
          name: 'Диспетчерская',
          line: 'Решения и ответы, которые двигают работу других людей.',
          benefit:
            'Собирает точки, где нужен ты: принять работу, выбрать исполнителя, снять блокер. Контекст выбранного вопроса открыт рядом.',
          tradeoff:
            'Для длинной самостоятельной работы нужен отдельный режим фокуса. Главная страница сильнее ориентирована на управление.',
        },
        atlas: {
          name: 'Атлас проектов',
          line: 'Весь портфель, ближайший результат и следующий шаг по каждому направлению.',
          benefit:
            'Помогает восстановить картину после переключения между агентством и разработкой. Видно, какой проект движется, ждёт решения или отложен.',
          tradeoff:
            'Начать одну конкретную задачу можно только после выбора направления. Обзор содержит больше информации.',
        },
        evolution: {
          name: 'Эволюция',
          line: 'Знакомая доска с более ясными карточками и следующими действиями.',
          benefit:
            'Сохраняет привычные области, «Все задачи», проекты слева и статусы. Улучшает чтение карточек, ожиданий и рабочего контекста.',
          tradeoff:
            'Длинную очередь всё ещё нужно просматривать и ранжировать. Основа организации задач остаётся прежней.',
        },
      };
      const tabs = [...document.querySelectorAll('.tab')];
      const frame = document.getElementById('concept');
      function show(id, updateHash = true) {
        const view = ideas[id] ? id : 'focus',
          d = ideas[view];
        tabs.forEach((t) => {
          const active = t.dataset.view === view;
          t.setAttribute('aria-selected', String(active));
          t.tabIndex = active ? 0 : -1;
        });
        if (frame.getAttribute('src') !== view + '.html')
          frame.src = view + '.html';
        frame.title = 'TaskIndex: ' + d.name;
        document
          .getElementById('canvas')
          .setAttribute('aria-labelledby', 'tab-' + view);
        document.getElementById('idea').textContent = d.line;
        document.getElementById('benefit').textContent = d.benefit;
        document.getElementById('tradeoff').textContent = d.tradeoff + ' ';
        document.getElementById('direct').href = view + '.html';
        if (updateHash) history.replaceState(null, '', '#' + view);
      }
      tabs.forEach((t, i) => {
        t.addEventListener('click', () => show(t.dataset.view));
        t.addEventListener('keydown', (e) => {
          let next;
          if (e.key === 'ArrowRight') next = (i + 1) % tabs.length;
          if (e.key === 'ArrowLeft') next = (i + tabs.length - 1) % tabs.length;
          if (e.key === 'Home') next = 0;
          if (e.key === 'End') next = tabs.length - 1;
          if (next !== undefined) {
            e.preventDefault();
            tabs[next].focus();
            show(tabs[next].dataset.view);
          }
        });
      });
      window.addEventListener('hashchange', () =>
        show(location.hash.slice(1), false),
      );
      document.getElementById('about').addEventListener('click', (e) => {
        const expanded =
          e.currentTarget.getAttribute('aria-expanded') !== 'true';
        e.currentTarget.setAttribute('aria-expanded', String(expanded));
        document.getElementById('notes').hidden = !expanded;
      });
      function setMobile(mobile) {
        document.getElementById('canvas').classList.toggle('mobile', mobile);
        document
          .getElementById('desktop')
          .setAttribute('aria-pressed', String(!mobile));
        document
          .getElementById('mobile')
          .setAttribute('aria-pressed', String(mobile));
      }
      document
        .getElementById('desktop')
        .addEventListener('click', () => setMobile(false));
      document
        .getElementById('mobile')
        .addEventListener('click', () => setMobile(true));
      const baseline = document.getElementById('baseline');
      document
        .getElementById('baseline-open')
        .addEventListener('click', () => baseline.showModal());
      document
        .getElementById('baseline-close')
        .addEventListener('click', () => baseline.close());
      baseline.addEventListener('click', (e) => {
        if (e.target === baseline) baseline.close();
      });
      show(location.hash.slice(1), false);
    </script>
  </body>
</html>
