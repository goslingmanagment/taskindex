function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filtered(){return tasks.filter(t=>views[view].states.includes(t.status)&&(area==='all'||t.area===area));}
function nav(){for(const [target,keys] of [['mainNav',['dispatch','work','waiting']],['savedNav',['parked','done']],['mobileNav',Object.keys(views)]]){$(target).innerHTML=keys.map(key=>`<button data-view="${key}" class="${view===key?'active':''}" aria-current="${view===key?'page':'false'}">${target==='mobileNav'?views[key].short:views[key].name}<span>${target==='mobileNav'?'':tasks.filter(t=>views[key].states.includes(t.status)).length}</span></button>`).join('');}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=filtered()[0]?.id||'';render();});}
function row(t){return `<button class="task-row ${t.id===selected?'selected':''}" data-task="${t.id}" aria-label="Открыть: ${esc(t.title)}" aria-pressed="${t.id===selected}"><span class="row-main"><span class="task-title">${esc(t.title)}</span><span class="row-meta"><span class="project">${esc(t.project)}</span><i class="project-dot"></i><span>${t.status==='waiting'?esc(t.person):t.area==='agency'?'Агентство':'Разработка'}</span></span></span><span class="row-right">${t.status==='waiting'?`<span class="when">${esc(t.shortDate)}</span>`:`<span>${esc(t.effort||'')}</span>`}${t.id===selected?'<span class="row-arrow" aria-hidden="true">→</span>':''}</span></button>`;}
function render(){nav();$('pageTitle').textContent=views[view].name;let decisions=tasks.filter(t=>t.status==='decision').length;$('pageNote').textContent=view==='dispatch'?decisions===3?'Три решения возвращают работу команде.':`Решений в очереди: ${decisions}. Ожидания — рядом.`:views[view].note;const list=filtered();if(!list.some(t=>t.id===selected))selected=list[0]?.id||'';$('queueAmount').textContent=`${list.length} в списке`;document.querySelectorAll('[data-area]').forEach(b=>{b.classList.toggle('active',b.dataset.area===area);b.setAttribute('aria-pressed',String(b.dataset.area===area));});$('groups').innerHTML=views[view].states.map(s=>{const items=list.filter(t=>t.status===s);if(!items.length)return'';const g=groups[s];return `<section class="group"><header class="group-heading"><h2><i class="section-dot ${g.dot}" aria-hidden="true"></i>${g.title}<span class="count">${items.length}</span></h2><span class="hint">${g.hint}</span></header><div class="task-list">${items.map(row).join('')}</div></section>`;}).join('')||'<div class="empty">В этом разделе пока нет задач.</div>';if(view==='dispatch'&&area!=='agency'&&tasks.find(t=>t.id==='contentops').status==='work'){$('groups').insertAdjacentHTML('beforeend','<button class="continuation" id="resume"><span class="resume-text"><small>ОСТАНОВИЛСЯ ЗДЕСЬ</small><strong>ContentOps · путь от файла к материалу</strong></span><span aria-hidden="true">↗</span></button>');$('resume').onclick=()=>{view='work';selected='contentops';render();};}document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{selected=b.dataset.task;render();$('detail').classList.add('open');});detail();}
function detail(){const t=tasks.find(t=>t.id===selected);if(!t){$('detail').innerHTML='<p class="context-text">Выберите другой раздел или направление.</p>';return;}const states={decision:'Моё решение',waiting:'Жду ответа',work:'В работе',queue:'В очереди',parked:'Отложено',done:'Завершено'};const list=filtered();$('detail').innerHTML=`<button class="mobile-back" id="back">← К списку задач</button><div class="detail-top"><span>${t.status==='decision'?'РЕШЕНИЕ':t.status==='waiting'?'ОЖИДАНИЕ':'ЗАДАЧА'} · ${esc(t.project.toUpperCase())}</span><span class="position">${list.findIndex(x=>x.id===t.id)+1} / ${list.length}</span></div><h2>${esc(t.title)}</h2><div class="detail-tags"><span class="status-tag ${t.status==='waiting'?'wait':''}">${states[t.status]}</span><span>${esc(t.effort||`Возврат ${t.date}`)}</span></div><div class="next-action"><div class="label">${t.status==='waiting'?'КОГДА ВЕРНУТЬСЯ':'СЛЕДУЮЩЕЕ ДЕЙСТВИЕ'}</div><p>${esc(t.next)}</p>${t.status==='waiting'?`<div class="waiting-person"><span>${esc(t.person)}</span><span>${esc(t.date)}</span></div>`:''}</div>${t.checks.length?`<section class="detail-section"><div class="section-title-line"><h3>${t.status==='decision'?'Чтобы закрыть вопрос':'Шаги задачи'}</h3><span class="progress-count">${t.done.length} / ${t.checks.length}</span></div><div class="checklist">${t.checks.map((c,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${t.done.includes(i)?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div></section>`:''}<div class="divider"></div><section class="detail-section"><h3>Контекст</h3><p class="context-text">${t.context}</p></section><dl class="context-grid"><dt>Ответственный</dt><dd>${esc(t.person)}</dd><dt>Направление</dt><dd>${t.area==='agency'?'Агентство':'Разработка'} / ${esc(t.project)}</dd><dt>Данные</dt><dd class="source-note">Демо · 8 сентября</dd></dl><div class="detail-bottom"><button class="complete-button" id="complete" ${t.status==='done'?'disabled':''}>${t.status==='done'?'Задача завершена':t.status==='decision'?'Решение принято':t.status==='waiting'?'Ответ получен · закрыть':'Отметить выполненной'}</button><p class="local-note">Изменения только в демо · сообщения не отправляются</p></div>`;$('back').onclick=()=>$('detail').classList.remove('open');document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const n=Number(c.dataset.check);t.done=c.checked?[...t.done,n]:t.done.filter(v=>v!==n);detail();});$('complete').onclick=()=>{if(t.status==='done')return;t.status='done';t.effort='Готово';t.next=t.result;t.done=t.checks.map((_,i)=>i);selected=filtered()[0]?.id||'';render();toast('Задача перенесена в завершённые · только в демо');};}
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200);}
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{area=b.dataset.area;render();});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('detail').classList.remove('open');});render();
</script>
</body>
</html>
