# Гейт релиза (TI-016) и сборка образа (TI-068). Автодеплоя нет: образ — артефакт workflow,
# который переносится на VPS вручную (docker load) и проверяется deploy.sh по метке
# org.opencontainers.image.revision. Реестр (GHCR) по решению владельца не используется.
name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # check = typecheck + lint + format:check + lint:shell (bash -n, shellcheck, tsc для deploy) + vitest
      - run: npm run check
      - run: npm run build
      # Проекты e2e: chromium (functional/visual/static/dark) и webkit (TI-018).
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build linux/amd64 image labelled with the commit
        run: |
          docker build --platform linux/amd64 \
            --build-arg "BUILD=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "taskindex:${GITHUB_SHA}" -f deploy/Dockerfile .
          label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "taskindex:${GITHUB_SHA}")
          [ "$label" = "$GITHUB_SHA" ] || { echo "label $label != $GITHUB_SHA" >&2; exit 1; }
          docker image inspect --format '{{.Id}}' "taskindex:${GITHUB_SHA}" > image-id.txt
          docker save "taskindex:${GITHUB_SHA}" | gzip -1 > "taskindex-${GITHUB_SHA}.tar.gz"
          ls -l "taskindex-${GITHUB_SHA}.tar.gz" image-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taskindex-image-${{ github.sha }}
          path: |
            taskindex-${{ github.sha }}.tar.gz
            image-id.txt
          if-no-files-found: error
          retention-days: 30
