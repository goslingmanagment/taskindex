# Гейт релиза (TI-016) и сборка образа (TI-068). Автодеплоя нет: образ — артефакт workflow,
# который переносится на VPS вручную (docker load) и проверяется deploy.sh по метке
# org.opencontainers.image.revision. Реестр (GHCR) по решению владельца не используется.
# Параллельно: check (типы, линт, формат, сборка, vitest — части идут рядом внутри одной job,
# scripts/ci-parallel-check.mjs), e2e (смоук основных сценариев на chromium) и image после check.
# release.sh ждёт зелёный прогон целиком.
#
# Пул машин: целевой — GitHub-hosted ubuntu-24.04 (4 vCPU, бесплатно для публичной репы).
# Переменная репозитория CI_POOL=pc отправляет первую попытку на self-hosted раннеры на ПК
# владельца (winpc-taskindex-N, метка ci-pc), любое другое значение или её отсутствие — на
# GitHub-hosted. Повторный запуск (run_attempt > 1) всегда идёт на GitHub: ПК мог умереть посреди
# прогона. PR из форка на ПК не идёт никогда, что бы ни стояло в CI_POOL: чужой код не должен
# исполняться на машине владельца. Это только первая защита (форк может поправить этот файл в своём
# PR); настоящая — ни одного self-hosted раннера у публичной репы.
# Раннеры ПК делят один $HOME (кэш npm ~/.npm и браузеры Playwright ~/.cache/ms-playwright живут
# там между прогонами, кэш actions не нужен), один сетевой стек (e2e раннера N работает в слоте
# портов N, TASKINDEX_E2E_SLOT в tests/e2e/helpers.ts) и rootless Docker; sudo у них нет:
# системные пакеты Playwright ставит root-setup.sh в 6-infra/ci-runners.
#
# PR, который меняет только документы (*.md где угодно, docs/**), ничего не проверяет: каждая job
# видит это вторым шагом и завершается зелёной за секунды, обязательные проверки отчитываются
# успехом. Почему не paths-ignore: непрошедший workflow не отчитывается, и PR с обязательной
# проверкой ждал бы её вечно. Push в main проверяется всегда целиком.
name: ci
on:
  # Ветки без PR не проверяются: push только в main и теги, остальное через pull_request.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
# Новый push в PR отменяет прогон прежнего коммита. У push в main и тега своя группа на прогон и без
# отмены: release.sh выкатывает коммит только с зелёным прогоном на нём, а общая группа ci-<ref> с
# отменой при двух быстрых слияниях отменяла прогон первого коммита.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Явный shell: bash — это bash -eo pipefail: упавшая команда в начале конвейера роняет шаг. Без него
# шаг идёт в bash -e, и, например, docker save | gzip с упавшим docker save оставлял обрезанный
# архив образа в зелёном прогоне.
defaults:
  run:
    shell: bash
jobs:
  # Ruleset main-required-ci требует check и e2e (functional-1): имена job не менять.
  check:
    # Draft не занимает раннер; Ready запускает проверки, возврат в Draft отменяет старый прогон.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      # Два коммита: у PR — merge-коммит GitHub и его первый родитель, вершина базы.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # Только документы в PR (см. начало файла): шаги ниже пропускаются, job зелёная.
      # Любое сомнение — run=true; шаги проверяют «не false», так что молчание шага ничего не пропускает.
      - name: Does this change need the checks?
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          run=true
          if git rev-parse -q --verify 'HEAD^2' > /dev/null && changed=$(git diff --name-only --no-renames 'HEAD^1' HEAD) && [ -n "$changed" ]; then
            run=false
            while IFS= read -r path; do
              case "$path" in
                *.md | docs/*) ;;
                *) run=true; echo "needs the checks: $path"; break ;;
              esac
            done <<< "$changed"
          fi
          [ "$run" = true ] || echo 'documents only (*.md, docs/**): nothing to check'
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run != 'false'
        with:
          node-version-file: .node-version
          # Кэш npm из actions только на GitHub-hosted: на ПК ~/.npm общий и постоянный.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - if: steps.scope.outputs.run != 'false'
        run: npm ci
      # check = typecheck + lint + format:check + build + vitest; части идут параллельно
      # (precheck первым), логи частей в конце, зелёные свёрнуты в группы; незнакомый скрипту
      # состав check или тело части идёт обычным npm run check. На ПК и на 4 vCPU GitHub одинаково.
      # exec: сигнал отмены раннер шлёт только процессу шага — скрипт гасит части и печатает их логи.
      - if: steps.scope.outputs.run != 'false'
        run: exec node scripts/ci-parallel-check.mjs
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: e2e (functional-1)
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # То же, что в check.
      - name: Does this change need the checks?
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          run=true
          if git rev-parse -q --verify 'HEAD^2' > /dev/null && changed=$(git diff --name-only --no-renames 'HEAD^1' HEAD) && [ -n "$changed" ]; then
            run=false
            while IFS= read -r path; do
              case "$path" in
                *.md | docs/*) ;;
                *) run=true; echo "needs the checks: $path"; break ;;
              esac
            done <<< "$changed"
          fi
          [ "$run" = true ] || echo 'documents only (*.md, docs/**): nothing to check'
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run != 'false'
        with:
          node-version-file: .node-version
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - if: steps.scope.outputs.run != 'false'
        run: npm ci
      # GitHub-hosted: браузер кэшируется по версии Playwright, системные пакеты ставит --with-deps.
      - id: playwright
        if: steps.scope.outputs.run != 'false' && runner.environment == 'github-hosted'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.scope.outputs.run != 'false' && runner.environment == 'github-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.scope.outputs.run != 'false' && runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium
      # ПК: системные пакеты уже стоят (sudo нет), браузеры лежат в общем ~/.cache/ms-playwright;
      # одновременные установки Playwright сериализует блокировкой __dirlock в этом каталоге.
      - if: steps.scope.outputs.run != 'false' && runner.environment == 'self-hosted'
        run: npx playwright install chromium
      # Раннер winpc-taskindex-N берёт слот портов N; GitHub-hosted — слот 0, исходные порты.
      - if: steps.scope.outputs.run != 'false'
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then export TASKINDEX_E2E_SLOT="${RUNNER_NAME##*-}"; fi
          echo "$RUNNER_NAME: TASKINDEX_E2E_SLOT=${TASKINDEX_E2E_SLOT:-0}"
          npm run e2e
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.run != 'false'
        with:
          name: test-results-e2e-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          # Перезапуск job в том же прогоне загружает артефакт с тем же именем: без overwrite 409.
          overwrite: true
          retention-days: 14
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build linux/amd64 image labelled with the commit
        run: |
          docker build --platform linux/amd64 \
            --build-arg "BUILD=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "taskindex:${GITHUB_SHA}" -f deploy/Dockerfile .
          label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "taskindex:${GITHUB_SHA}")
          [ "$label" = "$GITHUB_SHA" ] || { echo "label $label != $GITHUB_SHA" >&2; exit 1; }
          docker image inspect --format '{{.Id}}' "taskindex:${GITHUB_SHA}" > image-id.txt
          docker save "taskindex:${GITHUB_SHA}" | gzip -1 > "taskindex-${GITHUB_SHA}.tar.gz"
          gzip -t "taskindex-${GITHUB_SHA}.tar.gz"
          ls -l "taskindex-${GITHUB_SHA}.tar.gz" image-id.txt
      - uses: actions/upload-artifact@v7
        with:
          name: taskindex-image-${{ github.sha }}
          path: |
            taskindex-${{ github.sha }}.tar.gz
            image-id.txt
          if-no-files-found: error
          overwrite: true
          # release.sh сначала берёт образ, уже загруженный на VPS; архив нужен только для новых релизов.
          retention-days: 7
      # ПК: образ уже в архиве, в общем rootless Docker остаются только слои кэша сборки.
      - name: Remove the image from the shared Docker
        if: always() && runner.environment == 'self-hosted'
        run: docker image rm "taskindex:${GITHUB_SHA}" >/dev/null 2>&1 || true
