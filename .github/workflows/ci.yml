# Гейт релиза (TI-016) и сборка образа (TI-068). Автодеплоя нет: образ — артефакт workflow,
# который переносится на VPS вручную (docker load) и проверяется deploy.sh по метке
# org.opencontainers.image.revision. Реестр (GHCR) по решению владельца не используется.
# Параллельно: check (типы, линт, vitest, сборка), три job e2e на отдельных машинах
# (functional, visual+static+dark, webkit) и image после check. release.sh ждёт зелёный прогон целиком.
name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # check = typecheck + lint + unused-exports + format:check + lint:shell + build + check:skin + vitest
      - run: npm run check
  e2e:
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Проекты из tests/e2e/playwright.config.ts. Проект setup (вход владельца) идёт
          # зависимостью в каждом job и работает на headless-chromium, поэтому webkit-job
          # ставит ещё chromium-headless-shell.
          - name: functional
            install: chromium
            projects: functional
          - name: visual
            install: chromium
            projects: visual static dark
          - name: webkit
            install: webkit chromium-headless-shell
            projects: webkit webkit-dark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Браузер кэшируется по версии Playwright; системные пакеты ставит --with-deps.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.name }}
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - run: npm run e2e -- --project ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build linux/amd64 image labelled with the commit
        run: |
          docker build --platform linux/amd64 \
            --build-arg "BUILD=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "taskindex:${GITHUB_SHA}" -f deploy/Dockerfile .
          label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "taskindex:${GITHUB_SHA}")
          [ "$label" = "$GITHUB_SHA" ] || { echo "label $label != $GITHUB_SHA" >&2; exit 1; }
          docker image inspect --format '{{.Id}}' "taskindex:${GITHUB_SHA}" > image-id.txt
          docker save "taskindex:${GITHUB_SHA}" | gzip -1 > "taskindex-${GITHUB_SHA}.tar.gz"
          ls -l "taskindex-${GITHUB_SHA}.tar.gz" image-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taskindex-image-${{ github.sha }}
          path: |
            taskindex-${{ github.sha }}.tar.gz
            image-id.txt
          if-no-files-found: error
          retention-days: 30
