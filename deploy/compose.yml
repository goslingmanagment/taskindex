name: taskindex
services:
  app:
    image: ${TASKINDEX_IMAGE:?Set TASKINDEX_IMAGE to an immutable release tag}
    environment:
      DATABASE_PATH: /data/taskindex.db
      BASE_URL: ${BASE_URL:?Set the real HTTPS URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Supply using op run}
      # Читается только `taskindex-admin migrate` при первой инициализации базы;
      # действующий пояс хранится в settings.timezone, смена переменной его не меняет.
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      # debug|info|warn|error: порог структурного JSON-лога сервера и admin-команд (TI-020).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BUILD: ${TASKINDEX_BUILD:-local}
      # Внутри контейнера слушать все интерфейсы; наружу порт публикуется только на 127.0.0.1.
      HOST: '0.0.0.0'
      PORT: '3000'
      TASKINDEX_WRITES: held
      TASKINDEX_DEPLOYMENT: ${TASKINDEX_DEPLOYMENT:?Set a unique deployment attempt ID}
    ports:
      - '127.0.0.1:3100:3000'
    volumes:
      - data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'node', 'deploy/health.mjs']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  litestream:
    image: litestream/litestream:0.5.12
    user: '1000:1000'
    command: ['replicate', '-config', '/etc/litestream.yml']
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:?Set the replica URL (s3 prefix or file path under /data/replica)}
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT:-}
      LITESTREAM_S3_REGION: ${LITESTREAM_S3_REGION:-us-east-1}
      LITESTREAM_FORCE_PATH_STYLE: ${LITESTREAM_FORCE_PATH_STYLE:-false}
      # Пусто = heartbeat выключен (решение владельца 2026-09-11: внешнего получателя нет,
      # off-site копия снимается с мака, см. deploy/pull-backup.sh).
      LITESTREAM_HEARTBEAT_URL: ${LITESTREAM_HEARTBEAT_URL:-}
      # Нужны только для s3://; для file:// остаются пустыми.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped
    stop_grace_period: 40s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  data:
    name: ${TASKINDEX_VOLUME:-taskindex_data}
