# Replace TASKINDEX_DOMAIN with the chosen domain before nginx -t.
# Obtain its certificate using certbot --nginx or the webroot below first.
server {
    listen 80;
    listen [::]:80;
    server_name TASKINDEX_DOMAIN;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 (Debian 13, Ubuntu 24.10+). On nginx 1.22/1.24 (Debian 12,
    # Ubuntu 24.04) delete this line and write `listen 443 ssl http2;` above.
    http2 on;
    server_name TASKINDEX_DOMAIN;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/TASKINDEX_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TASKINDEX_DOMAIN/privkey.pem;
    # With `certbot --nginx` these four ssl_* lines may be replaced by
    # `include /etc/letsencrypt/options-ssl-nginx.conf;`; keep HSTS and http2 here.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Only the TLS terminator knows the connection is secure. No includeSubDomains
    # until the owner confirms there are no plain-HTTP services on subdomains; no preload.
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4m;

    # The application sets its own security headers and Cache-Control;
    # no add_header inside locations, which would drop the HSTS inheritance.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /health is consumed only inside the perimeter (deploy scripts, compose
    # healthcheck via 127.0.0.1:3100); external uptime monitors use GET /.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3100;
    }
    location = /api/events/stream {
        # The gzip module buffers the response and ignores no-transform; SSE must stream.
        gzip off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / { proxy_pass http://127.0.0.1:3100; }
}
