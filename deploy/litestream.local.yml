logging:
  type: json
  stderr: true
snapshot:
  interval: 1h
  retention: 720h
# Тот же heartbeat, что в production; в drill его принимает deploy/drill/heartbeat-receiver.mjs.
heartbeat-url: ${LITESTREAM_HEARTBEAT_URL}
heartbeat-interval: 1m
socket:
  enabled: true
  path: /data/litestream.sock
  permissions: 0600
dbs:
  - path: /data/taskindex.db
    meta-path: /data/.taskindex.db-litestream
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      auto-recover: false
