logging:
  type: json
  stderr: true
snapshot:
  interval: 24h
  retention: 720h
shutdown-sync-timeout: 30s
# Dead-man switch (TI-002): пинг уходит раз в минуту только после успешного sync всех баз.
# Получатель (healthchecks.io, период 1 мин, grace 3 мин) оповещает владельца при пропуске.
heartbeat-url: ${LITESTREAM_HEARTBEAT_URL}
heartbeat-interval: 1m
# addr: ":9090"  # Prometheus-метрики; включать только при наличии коллектора, порт на хост не публиковать
socket:
  enabled: true
  path: /data/litestream.sock
  permissions: 0600
dbs:
  - path: /data/taskindex.db
    meta-path: /data/.taskindex.db-litestream
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      endpoint: ${LITESTREAM_S3_ENDPOINT}
      region: ${LITESTREAM_S3_REGION}
      force-path-style: ${LITESTREAM_FORCE_PATH_STYLE}
      auto-recover: false
